name: Test org account type requires org-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          account-type: org
          # org-name intentionally omitted to trigger validation error
          image-names: my-test-image
          timestamp-to-use: updated_at
          cut-off: 2 days ago UTC
          token: fake-token
          dry-run: 'true'
          token-type: pat

      - name: Assert action failed due to missing org-name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when org-name is missing for org account type"
            exit 1
          fi
          echo "PASS: action correctly failed when org-name was not provided"
