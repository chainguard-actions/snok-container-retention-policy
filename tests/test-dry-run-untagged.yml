name: Test dry-run untagged images only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          account: ${{ github.repository_owner }}
          token: ${{ github.token }}
          image-names: nonexistent-test-image-for-dry-run
          cut-off: 1s
          dry-run: 'true'
          tag-selection: untagged
          keep-n-most-recent: '0'
          timestamp-to-use: updated_at

      - name: Assert action ran (dry-run mode with untagged tag-selection)
        env:
          DELETED: ${{ steps.action.outputs.deleted }}
          FAILED: ${{ steps.action.outputs.failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deleted: $DELETED"
          echo "failed: $FAILED"
          # The action may exit non-zero if the package doesn't exist (API 404).
          # We accept both success and failure outcomes since the image doesn't exist.
          # What matters is that the action ran (not a setup/infrastructure failure).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in dry-run mode with untagged tag-selection (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
