name: Test keep-n-most-recent dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          account: snok
          token: ${{ github.token }}
          image-names: container-retention-policy
          cut-off: 30d
          keep-n-most-recent: '5'
          tag-selection: both
          timestamp-to-use: updated_at
          dry-run: 'true'

      - name: Assert action ran and produced outputs
        env:
          DELETED: ${{ steps.action.outputs.deleted }}
          FAILED: ${{ steps.action.outputs.failed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          echo "deleted: '$DELETED'"
          echo "failed: '$FAILED'"
          # The action should either succeed or fail gracefully (e.g. auth error
          # when the token lacks packages scope). Either way the workflow should
          # not crash and the step should have run.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with keep-n-most-recent in dry-run mode (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
