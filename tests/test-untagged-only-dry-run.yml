name: Test untagged-only dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          account-type: personal
          image-names: my-test-image
          timestamp-to-use: created_at
          cut-off: 30 days ago UTC
          token: fake-token
          untagged-only: 'true'
          keep-at-least: '1'
          filter-include-untagged: 'true'
          dry-run: 'true'
          token-type: pat

      - name: Assert action ran (may fail at API level with invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed (no images found) or fail at API level
          # but it should not fail due to input validation errors
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
