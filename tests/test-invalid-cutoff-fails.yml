name: Test invalid cut-off format fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          account-type: personal
          image-names: my-test-image
          timestamp-to-use: updated_at
          # Missing timezone - should fail validation
          cut-off: not-a-valid-date-at-all-xyz123
          token: fake-token
          dry-run: 'true'
          token-type: pat

      - name: Assert action failed due to invalid cut-off
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid cut-off format"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid cut-off"
